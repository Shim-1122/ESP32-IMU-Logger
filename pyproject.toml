[project]
name = "esp32-imu-logger"
version = "1.0.0"
description = "ESP32-C6 + ICM-20948 9-axis attitude and heading estimation with an extended Kalman filter, a Python live plotter, and a Blender flight portal"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# matplotlib on Python 3.9 triggers deprecation notices inside the pyparsing library; they are not from this code
filterwarnings = ["ignore:.*deprecated - use:DeprecationWarning"]
