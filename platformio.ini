; Three build targets; `pio run` builds all of them.
;   pio run -e esp32c6 -t upload     flash an ESP32-C6 DevKit (ICM-20948)
;   pio run -e esp32dev -t upload    flash an original ESP32 DevKit (ICM-20948)
;   pio run -e wokwi                 firmware for the Wokwi simulator (MPU6050, no magnetometer)
[platformio]
default_envs = esp32c6, esp32dev, wokwi

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; ESP32-C6 DevKit (single RISC-V core, CH343 USB serial)
[env:esp32c6]
board = esp32-c6-devkitc-1

; Original dual-core ESP32 DevKit
[env:esp32dev]
board = esp32dev

; Wokwi has no ICM-20948 part, so the simulation uses its MPU6050 (accel and gyro only)
[env:wokwi]
board = esp32dev
build_flags = ${env.build_flags} -DIMU_MPU6050
