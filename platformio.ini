; Two build targets. `pio run` builds both; `pio run -e esp32c6 -t upload` flashes the C6.
[platformio]
default_envs = esp32c6, esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; ESP32-C6 DevKit (single RISC-V core, CH343 USB serial, LP I2C on GPIO 6/7)
[env:esp32c6]
board = esp32-c6-devkitc-1

; Original dual-core ESP32 DevKit (also the board used by the Wokwi simulation)
[env:esp32dev]
board = esp32dev
