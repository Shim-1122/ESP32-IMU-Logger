<text x='76' y='288' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>do not use (boot, USB, UART)</text>
<rect x='24' y='598' width='952' height='100' rx='6' fill='#f4f6f8' stroke='#d5dbe1'/>
<text x='38' y='620' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Power the ICM-20948 board from 3V3. Pin order differs between boards: match the printed labels, or use its Qwiic / STEMMA QT connector.</text>
<text x='38' y='641' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Plug the USB-C port marked CH343: the firmware prints on it. Avoid GPIO 4, 5, 8, 9, 15 (boot straps, LED), 12, 13 (native USB), TX, RX.</text>
<text x='38' y='662' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Leave AD0, INT and FSYNC unconnected (the firmware finds the IMU at 0x69 or 0x68). Most breakout boards include I2C pull-ups.</text>
<text x='38' y='683' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Mount the IMU board flat, in the same plane as the ESP32-C6. X (forward), Y (left), Z (up) as printed; yaw is 0 when X points at magnetic north.</text>
</svg>
