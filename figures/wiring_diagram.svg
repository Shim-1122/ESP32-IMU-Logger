<text x='135' y='368' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#555'>SDA GPIO 6, SCL GPIO 7 (fixed pins)</text>
<text x='865' y='392' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='middle' font-weight='bold' fill='#333'>Bus 0: Wire (main I2C), 400 kHz</text>
<text x='865' y='408' font-family='Helvetica, Arial, sans-serif' font-size='11' text-anchor='middle' font-weight='normal' fill='#555'>SDA GPIO 21, SCL GPIO 22</text>
