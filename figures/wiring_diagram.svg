<text x='60' y='424' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>3V3 power</text>
<line x1='24' y1='440' x2='52' y2='440' stroke='#222222' stroke-width='3'/>
<text x='60' y='444' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Ground</text>
<line x1='24' y1='460' x2='52' y2='460' stroke='#1f6fd1' stroke-width='3'/>
<text x='60' y='464' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>SCL (clock)</text>
<line x1='24' y1='480' x2='52' y2='480' stroke='#2a9d3c' stroke-width='3'/>
<text x='60' y='484' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>SDA (data)</text>
<circle cx='38' cy='504' r='4' fill='#7a4b4b'/>
<text x='60' y='508' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>do not use (boot, USB, UART)</text>
<rect x='24' y='598' width='952' height='100' rx='6' fill='#f4f6f8' stroke='#d5dbe1'/>
<text x='38' y='620' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Power both sensor boards from 3V3 and connect all grounds. Leave XDA, XCL, INT, DRDY unconnected; AD0 unconnected keeps the MPU6050 at 0x68.</text>
<text x='38' y='641' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Plug the USB-C port marked CH343: the firmware prints on it. Avoid GPIO 4, 5, 8, 9, 15 (boot straps, LED), 12, 13 (native USB), TX, RX.</text>
<text x='38' y='662' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>GY-521 and GY-271 boards usually have I2C pull-ups. If yours does not, add 4.7 kOhm from SDA and from SCL to 3V3 on each bus.</text>
<text x='38' y='683' font-family='Helvetica, Arial, sans-serif' font-size='12' text-anchor='start' font-weight='normal' fill='#333'>Mount both boards flat in the same plane as the ESP32-C6, with their printed X and Y arrows pointing the same way.</text>
</svg>
